site_name: Synchronet BBS for Mere Mortals
site_description: A bulletin board system you run yourself on your own machine. Installing Synchronet on Linux from the project sources, giving the board a name, creating its sysop and its first caller, and posting and reading messages in local boards, with the limits stated plainly.
